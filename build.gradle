plugins {
	id 'java'
	id 'application'
	id("com.gradleup.shadow") version "9.3.0"
	id 'eclipse'
}

group = 'etri'
version = System.getenv("MDT_BUILD_VERSION") ?: "unknown"

application {
	mainClass = 'lg.inspector.InspectorCompanion'
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}
tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation project(":utils")
	implementation project(":mdt-client")
	
	// @Nullable
	compileOnly libs.jetbrains.annotations
	// @GuardedBy
	compileOnly libs.findbugs.jsr305

	// // Lombok (from the project :utils)
	// compileOnly "org.projectlombok:lombok:${lombok_version}"
	// annotationProcessor "org.projectlombok:lombok:${lombok_version}"

	// // logback with SLF4j (from the project :utils)
	// implementation "ch.qos.logback:logback-classic:${logback_version}"
	
	// picocli command line parser
	implementation libs.picocli
	annotationProcessor libs.picocli.codegen
	
	// // ProgressBar
	// implementation "me.tongfei:progressbar:${progress_bar_version}"
	
	// // jackson 
	// implementation "com.fasterxml.jackson.core:jackson-databind:${jackson_version}"
	implementation libs.jackson.datatype.jsr310
	
	// // CSV
	// implementation "de.siegmar:fastcsv:${fastcsv_version}"
	
	// // AAS model
	// implementation "org.eclipse.digitaltwin.aas4j:aas4j-dataformat-json:${aas4j_version}"
	
	// // PostgreSQL
	// implementation "org.postgresql:postgresql:${postgresql_version}"
	
	// MQTT
	implementation libs.paho.mqttv3
	
	// testImplementation "junit:junit:${junit_version}"
	// testImplementation "org.mockito:mockito-core:${mockito_version}"
	// testImplementation "org.junit.platform:junit-platform-launcher:${junit_jupiter_version}"
	// testRuntimeOnly "org.junit.vintage:junit-vintage-engine:${junit_jupiter_version}"
}

jar {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

shadowJar {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	mergeServiceFiles()

	exclude 'META-INF/*.SF'
	exclude 'META-INF/*.DSA'
	exclude 'META-INF/*.RSA'
}

eclipse {
	classpath {
		file {
			whenMerged { cp ->
				def linkedProjectBuildLibDirs = [
					project(':utils').projectDir.toPath().resolve('build/libs').toUri().getPath().replaceAll('/+$', '')
				]
				cp.entries.removeAll { entry ->
					entry.kind == 'lib'
						&& entry.path != null
						&& linkedProjectBuildLibDirs.any { dir -> entry.path.startsWith(dir + '/') }
				}
				cp.entries.each { entry ->
					if (entry.kind == 'src' && entry.path == 'src/main/resources') {
						entry.excludes = []
					}
					if (entry.kind == 'src' && entry.path == 'src/test/resources') {
						entry.excludes = []
					}
				}
			}
		}
	}
}
